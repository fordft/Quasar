name: Feature request
description: Suggest an improvement to Quasar
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Quasar has a focused product direction, so a clear problem matters more than a proposed solution. Please read [CONTRIBUTING.md](https://github.com/fordft/Quasar/blob/main/CONTRIBUTING.md) before proposing larger changes. For open-ended ideas, start a [Discussion](https://github.com/fordft/Quasar/discussions).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behavior you have in mind. A sketch or reference is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or how other browsers handle it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browsing and tabs
        - Privacy and protection
        - Extensions
        - Work and AI
        - Settings and interface
        - Performance
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and did not find this request
          required: true
        - label: This does not require telemetry or collecting user data
          required: true
